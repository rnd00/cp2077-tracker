    <style>
        :root { --cp-yellow: #fcee0a; --cp-blue: #00f0ff; --cp-black: #050505; --cp-red: #ff3c3c; --text: #e6e6e6; }
        body { background: var(--cp-black); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; background-attachment: fixed; background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02)); background-size: 100% 4px, 3px 100%; }
        .container { max-width: 1100px; margin: 0 auto; }
        .dashboard { position: sticky; top: 0; background: rgba(5,5,5,0.98); padding: 15px; z-index: 1000; border: 1px solid var(--cp-blue); margin-bottom: 20px; box-shadow: 0 0 15px rgba(0,240,255,0.2); }
        .bar-bg { background: #222; height: 10px; border: 1px solid #333; margin: 10px 0; }
        .bar-fill { background: var(--cp-yellow); height: 100%; width: 0%; transition: 0.5s; }
        .search-box { width: 100%; background: #000; border: 1px solid var(--cp-yellow); color: var(--cp-yellow); padding: 12px; margin-bottom: 10px; box-sizing: border-box; }
        .filter-row { display: flex; flex-wrap: wrap; gap: 8px; }
        .btn { background: #111; border: 1px solid #444; color: #888; padding: 6px 12px; cursor: pointer; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
        .btn.active { background: var(--cp-blue); color: #000; border-color: var(--cp-blue); }
        .section { margin-bottom: 10px; border: 1px solid #222; background: rgba(10,10,10,0.8); }
        .section-head { background: #1a1a1a; padding: 12px; cursor: pointer; display: flex; justify-content: space-between; border-left: 4px solid var(--cp-blue); transition: 0.3s; }
        .section-head:hover { background: #252525; }
        .section-content { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; padding: 15px; }
        .section-content.collapsed { display: none; }
        .job-card { background: #0d0d0d; border: 1px solid #222; padding: 12px; display: flex; flex-direction: column; position: relative; }
        .job-card:hover { border-color: var(--cp-yellow); }
        .job-card.done { opacity: 0.3; filter: grayscale(1); }
        .job-card a { color: var(--text); text-decoration: none; font-weight: bold; font-size: 0.95rem; }
        .badge { font-size: 9px; padding: 2px 5px; margin-top: 5px; font-weight: bold; text-transform: uppercase; display: inline-block; border-radius: 2px; }
        .iconic { background: var(--cp-yellow); color: #000; margin-right: 5px; }
        .missable { background: var(--cp-red); color: #fff; margin-right: 5px; }
        .romance { border: 1px solid #ff69b4; color: #ff69b4; margin-right: 5px; }
        .note-area { width: 100%; background: #000; border: 1px solid #333; color: var(--cp-blue); font-size: 11px; margin-top: 8px; padding: 5px; display: none; box-sizing: border-box; }
        .hidden { display: none !important; }
    </style>
</head>

    const container = document.getElementById('list-container');

    function render() {
        container.innerHTML = '';
        const categories = [...new Set(jobs.map(j => j.cat))];
        
        categories.forEach(cat => {
            const section = document.createElement('div');
            section.className = 'section';
            section.innerHTML = `<div class="section-head" onclick="toggleCat('${cat}')"><b>${cat.toUpperCase()}</b><span id="arr-${cat}">▼</span></div>
                                 <div class="section-content" id="cnt-${cat}"></div>`;
            container.appendChild(section);
            
            jobs.filter(j => j.cat === cat).forEach(job => {
                const isDone = localStorage.getItem(job.id) === 'true';
                const card = document.createElement('div');
                card.className = `job-card ${isDone ? 'done' : ''}`;
                card.id = `card-${job.id}`;
                
                let badges = '';
                if(job.tags.includes('iconic')) badges += `<span class="badge iconic">🔫 ${job.reward || 'Iconic'}</span>`;
                if(job.tags.includes('missable')) badges += `<span class="badge missable">⚠️ Missable</span>`;
                if(job.tags.includes('romance')) badges += `<span class="badge romance">❤️ Romance</span>`;

                card.innerHTML = `
                    <div style="display:flex; align-items:flex-start">
                        <input type="checkbox" id="${job.id}" ${isDone ? 'checked' : ''} onchange="sync('${job.id}')">
                        <div style="margin-left:10px; flex-grow:1">
                            <a href="${job.link}" target="_blank">${job.name}</a>
                            <div style="margin-top:4px">${badges}</div>
                        </div>
                        <button class="btn" style="padding:2px 5px" onclick="toggleNote('${job.id}')">📝</button>
                    </div>
                    <textarea id="n-${job.id}" class="note-area" onkeyup="saveNote('${job.id}')" placeholder="Enter choice notes...">${localStorage.getItem('note-'+job.id)||''}</textarea>
                `;
                document.getElementById(`cnt-${cat}`).appendChild(card);
                if(localStorage.getItem('note-'+job.id)) document.getElementById('n-'+job.id).style.display = 'block';
            });
        });
        updateProgress();
    }

    function sync(id) {
        localStorage.setItem(id, document.getElementById(id).checked);
        document.getElementById(`card-${id}`).classList.toggle('done', document.getElementById(id).checked);
        updateProgress();
    }
    function saveNote(id) { localStorage.setItem('note-'+id, document.getElementById('n-'+id).value); }
    function toggleNote(id) { const el = document.getElementById('n-'+id); el.style.display = el.style.display === 'block' ? 'none' : 'block'; }
    function toggleCat(cat) { const el = document.getElementById('cnt-'+cat); el.classList.toggle('collapsed'); document.getElementById('arr-'+cat).innerText = el.classList.contains('collapsed') ? '▶' : '▼'; }

    function updateProgress() {
        const done = jobs.filter(j => localStorage.getItem(j.id) === 'true').length;
        const pct = Math.round((done / jobs.length) * 100) || 0;
        document.getElementById('prog-bar').style.width = pct + '%';
        document.getElementById('pct-text').innerText = `${done} / ${jobs.length} QUESTS LOADED (${pct}%)`;
    }

    function filter() {
        const q = document.getElementById('search').value.toLowerCase();
        const hideDone = localStorage.getItem('hideDone') === 'true';
        jobs.forEach(j => {
            const matches = (j.name.toLowerCase().includes(q) || (j.reward && j.reward.toLowerCase().includes(q))) &&
                            (!currentTag || j.tags.includes(currentTag)) &&
                            (!hideDone || localStorage.getItem(j.id) !== 'true');
            document.getElementById(`card-${j.id}`).classList.toggle('hidden', !matches);
        });
    }

    function filterByTag(tag) {
        currentTag = currentTag === tag ? null : tag;
        document.querySelectorAll('.filter-row .btn').forEach(b => b.classList.toggle('active', b.innerText.toLowerCase().includes(tag) && currentTag));
        filter();
    }

    function toggleHideDone() {
        localStorage.setItem('hideDone', localStorage.getItem('hideDone') !== 'true');
        document.getElementById('hideDone').classList.toggle('active', localStorage.getItem('hideDone') === 'true');
        filter();
    }

    function clearData() { if(confirm("CLEAR ALL PROGRESS?")) { localStorage.clear(); location.reload(); } }
    render();
</script>
</body>
</html>
